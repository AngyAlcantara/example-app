<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Contador Avanzado</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">

  <!-- Muestra el valor actual del contador -->
  <h1 style="font-size: 80px; margin: 40px 0;">{{ contador }}</h1>

  <!-- Botones para controlar la sucesión -->
  <div style="display: flex; justify-content: center; gap: 10px;">
    <ion-button color="success" (click)="incrementar()">
      Avanzar (+1)
    </ion-button>

    <ion-button color="secondary" (click)="decrementar()">
      Retroceder (-1)
    </ion-button>

    <ion-button color="danger" (click)="reiniciar()">
      Reset
    </ion-button>
  </div>

</ion-content>
